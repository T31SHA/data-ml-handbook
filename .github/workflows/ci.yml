name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
concurrency: { group: ci-${{ github.ref }}, cancel-in-progress: true }
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with: { globs: "content/*.md README.md CONTRIBUTING.md" }
      - uses: lycheeverse/lychee-action@v2
        continue-on-error: true   # external sites flake; report without blocking
        with: { args: "--config .lychee.toml --no-progress README.md content/*.md", fail: true }
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - run: make test
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: build/mathjax/package-lock.json }
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu graphviz
      - run: make fonts
      - run: pip install -r requirements-build.txt
      - run: make pdf
      - run: make docs
      - uses: actions/upload-artifact@v4
        with: { name: Data-ML-Handbook-pdf, path: dist/Data-ML-Handbook.pdf, retention-days: 30 }
