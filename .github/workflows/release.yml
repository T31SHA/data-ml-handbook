name: Release
on:
  push: { tags: ["v*"] }
permissions: { contents: write }
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: build/mathjax/package-lock.json }
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu graphviz
      - run: make fonts
      - run: pip install -r requirements-build.txt
      - run: make pdf && cp dist/Data-ML-Handbook.pdf "dist/Data-ML-Handbook-${GITHUB_REF_NAME}.pdf"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Data-ML-Handbook.pdf
            dist/Data-ML-Handbook-${{ github.ref_name }}.pdf
          generate_release_notes: true
